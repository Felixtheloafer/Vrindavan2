<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc">
  <title id="title">Radha at dusk</title>
  <desc id="desc">An original painterly portrait of a dark-haired woman in a deep maroon sari with antique gold embroidery, standing beneath a temple arch at dusk.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d2a28"/>
      <stop offset=".42" stop-color="#3c111a"/>
      <stop offset="1" stop-color="#18050b"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".42" r=".5">
      <stop offset="0" stop-color="#f3d9a0" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#d5a25f" stop-opacity=".13"/>
      <stop offset="1" stop-color="#d5a25f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#f4d5ba"/>
      <stop offset=".5" stop-color="#e5b597"/>
      <stop offset="1" stop-color="#bd8069"/>
    </linearGradient>
    <linearGradient id="skinShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98d76" stop-opacity="0"/>
      <stop offset="1" stop-color="#a56050" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="hair" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#4a2a20"/>
      <stop offset=".35" stop-color="#2b1512"/>
      <stop offset=".7" stop-color="#180b0b"/>
      <stop offset="1" stop-color="#3a211b"/>
    </linearGradient>
    <linearGradient id="hairLight" x1="0" y1="0" x2="1" y2=".3">
      <stop offset="0" stop-color="#8f5b3f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8f5b3f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sari" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#6b1226"/>
      <stop offset=".45" stop-color="#4a0a19"/>
      <stop offset="1" stop-color="#2a0510"/>
    </linearGradient>
    <linearGradient id="sariLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a12a3f" stop-opacity=".65"/>
      <stop offset=".5" stop-color="#73152c" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2a0510" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#7a1a2f"/>
      <stop offset=".55" stop-color="#540d1e"/>
      <stop offset="1" stop-color="#320714"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2b1"/>
      <stop offset=".4" stop-color="#d7b06e"/>
      <stop offset=".7" stop-color="#a97b39"/>
      <stop offset="1" stop-color="#e5c485"/>
    </linearGradient>
    <linearGradient id="goldDim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b778"/>
      <stop offset="1" stop-color="#8a6026"/>
    </linearGradient>
    <radialGradient id="cheek" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d97a76" stop-opacity=".38"/>
      <stop offset="1" stop-color="#d97a76" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="jaali" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M21 2 40 21 21 40 2 21Z" fill="none" stroke="#d7b06e" stroke-opacity=".16" stroke-width="1"/>
      <circle cx="21" cy="21" r="3" fill="#d7b06e" fill-opacity=".12"/>
    </pattern>
  </defs>

  <rect width="600" height="760" fill="url(#sky)"/>
  <rect width="600" height="760" fill="url(#jaali)" opacity=".55"/>

