    <path d="M270 455V258c0-26 13-40 30-40s30 14 30 40v197" fill="none" stroke="#c9a15c" stroke-opacity=".22" stroke-width="1"/>
    <circle cx="300" cy="180" r="3" fill="#f0d9a4" opacity=".7"/>
  </g>
  <rect y="455" width="600" height="305" fill="#17050b" opacity=".88"/>
  <ellipse cx="304" cy="330" rx="300" ry="310" fill="url(#halo)"/>

