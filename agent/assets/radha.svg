  <g stroke="#c9a15c" stroke-opacity=".5" fill="none">
    <path d="M74 0v42M526 0v62"/>
    <path d="M60 42h28l8 34H52Z" fill="#d7b06e" fill-opacity=".12"/>
    <path d="M512 62h28l7 30h-42Z" fill="#d7b06e" fill-opacity=".1"/>
